# Rules apply from top to bottom. First match wins, including subdomains.
# Use profile names from --list-profiles. Changes apply to the next link.
# With no rules, Helium chooses the profile.
#
# Browser bundle IDs:
# Helium:   net.imput.helium
# Chrome:   com.google.Chrome
# Chromium: org.chromium.Chromium
# Brave:    com.brave.Browser
# Edge:     com.microsoft.edgemac
# Vivaldi:  com.vivaldi.Vivaldi
#
# @browser net.imput.helium
# @fallback Personal
# github.com Work
# youtube.com Personal
# example.com com.google.Chrome::Work
# example.org com.brave.Browser::
