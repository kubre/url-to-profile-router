# One rule per line: <domain> <profile display name or directory>.
# First match wins. Names may contain spaces; do not quote them.
# Comments occupy their own line. Verify names with --list-profiles.
github.com tars
youtube.com persoanl
youtu.be persoanl

# Wildcards (put specific rules before broad ones):
# Exact host and descendants:
# music.example.com Work Team
# Subdomains only, NOT example.com:
# *.example.com Profile 2
# Root AND subdomains, every path/query:
# example.com Default
# Hosts only: https://example.com/*, foo*.com and regex are not supported.
# Catch-all for unmatched WEB links:
# @fallback Default
# Local file:/// URLs always use the browser's last-used profile.

# Choose ONE browser for all rules; uncomment only its @browser line.
# Helium (default)
# @browser net.imput.helium
# Google Chrome
# @browser com.google.Chrome
# Brave
# @browser com.brave.Browser
# Microsoft Edge
# @browser com.microsoft.edgemac
# Vivaldi
# @browser com.vivaldi.Vivaldi
# Chromium
# @browser org.chromium.Chromium
# Switching browser also switches profile discovery. Recheck profile names.

# Custom Chromium data: use the PARENT of chrome://version's Profile Path.
# It must already contain Local State; never select Default/Profile N itself.
# @user-data-dir ~/Library/Application Support/Google/Chrome Beta
# Use the custom browser's actual bundle ID with that override.

# Safari/Firefox can open URLs normally, but not select profiles here.
# For them, REMOVE all domain rules, @fallback and @user-data-dir first:
# @browser com.apple.Safari
# @browser org.mozilla.firefox
