name: release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release artifacts
        run: |
          mkdir -p ./release
          ./release-package.sh ./release "${{ github.ref_name }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/URL-to-Profile-Router-${{ github.ref_name }}.zip
            ./release/URL-to-Profile-Router-${{ github.ref_name }}.dmg
